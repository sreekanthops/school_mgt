# /etc/nginx/sites-available/school
#
# Prerequisites:
#   1. Replace school.example.com with your actual domain.
#   2. Run: sudo certbot --nginx -d school.example.com
#      Certbot will add the ssl_certificate / ssl_certificate_key lines
#      and convert the HTTP block to a redirect automatically.
#      After that you can remove the two commented-out ssl lines below.
#
# The frontend (React SPA) is served from /opt/school/frontend/dist.
# All /api/* requests are reverse-proxied to Uvicorn at 127.0.0.1:8000.

server {
    listen 80;
    server_name school.example.com;
    # Certbot will add: return 301 https://$host$request_uri;
    # Until then, redirect manually:
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name school.example.com;

    # ── TLS (filled in by Certbot) ───────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/school.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example.com/privkey.pem;

    # Strong TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ── Static frontend ──────────────────────────────────────────────────────
    root /opt/school/frontend/dist;
    index index.html;

    # React SPA — any path that is not a real file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets (Vite fingerprints filenames)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API reverse proxy ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # FastAPI docs
        proxy_read_timeout 60s;
    }

    # ── Upload size limit ────────────────────────────────────────────────────
    # Smart Import accepts up to 5 MB; photos up to 3 MB.
    client_max_body_size 6m;

    # ── Block access to hidden files ─────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
